<line x1="20.0" y1="82.0" x2="20.0" y2="53.0" stroke="#d0342c" stroke-width="3.2" stroke-linecap="round"/><polygon points="20.0,40.0 26.0,53.0 14.0,53.0" fill="#d0342c"/>
<text x="48" y="68" font-size="19" fill="#222">низ, бока и углы: зацепка на самой крышке — низ 15, бока по 6, углы 4; положения по эскизу</text>
<text x="48" y="118" font-size="19" font-weight="bold" fill="#222">Всего 47 защёлок. Стрелка — бугорок зацепки и направление зацепа; двойная — зубцы через 8 мм.</text>
